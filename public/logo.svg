<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="gln-grad-primary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="gln-grad-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gln-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="gln-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblem Mark Group -->
  <g transform="translate(10, 10)" filter="url(#gln-glow)">
    <!-- Outer Globe Ring -->
    <circle cx="40" cy="40" r="36" stroke="#059669" stroke-width="4.5" fill="none" opacity="0.9" />
    
    <!-- Longitude Curves -->
    <path d="M40 4 C 22 4, 16 22, 16 40 C 16 58, 22 76, 40 76" stroke="#10b981" stroke-width="3" fill="none" opacity="0.65" />
    <path d="M40 4 C 58 4, 64 22, 64 40 C 64 58, 58 76, 40 76" stroke="#10b981" stroke-width="3" fill="none" opacity="0.65" />
    
    <!-- Latitude Line -->
    <path d="M6 40 Q 40 46 74 40" stroke="#10b981" stroke-width="3" fill="none" opacity="0.6" />
    <path d="M12 24 Q 40 28 68 24" stroke="#10b981" stroke-width="2" fill="none" opacity="0.4" />
    <path d="M12 56 Q 40 52 68 56" stroke="#10b981" stroke-width="2" fill="none" opacity="0.4" />

    <!-- Dynamic Curved Swoosh / Greenline -->
    <path d="M 10 68 C 18 42, 34 22, 78 16 C 56 26, 32 46, 26 72 Z" fill="url(#gln-grad-primary)" />
    
    <!-- Stylized Environmental Leaf Inside -->
    <path d="M 38 48 C 38 34, 52 28, 64 28 C 64 42, 50 48, 38 48 Z" fill="url(#gln-grad-leaf)" />
    <path d="M 40 46 Q 52 36 62 30" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
    
    <!-- Accent Dot -->
    <circle cx="78" cy="16" r="3" fill="#34d399" />
  </g>

  <!-- Typography: GREENLINE NEWS -->
  <g transform="translate(102, 16)">
    <!-- Brand Name: GREENLINE -->
    <text x="0" y="38" font-family="'Playfair Display', Georgia, serif" font-size="36" font-weight="900" fill="#047857" letter-spacing="-0.5">
      Greenline
    </text>
    
    <!-- NEWS Pill / Tag -->
    <rect x="182" y="14" width="80" height="28" rx="6" fill="url(#gln-grad-dark)" />
    <text x="222" y="33" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="2" text-anchor="middle">
      NEWS
    </text>

    <!-- Tagline: Truth in Every Line -->
    <text x="2" y="58" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="3">
      TRUTH IN EVERY LINE
    </text>
    
    <!-- Green Accent underline dot/line -->
    <circle cx="160" cy="55" r="2.5" fill="#10b981" />
  </g>
</svg>
